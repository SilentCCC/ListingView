services:
  listing-view:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_DIR: /data
      CLIENT_DIST_DIR: /app/client/dist
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VISION_API_BASE_URL: ${VISION_API_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
    volumes:
      - listing-view-data:/data
    restart: unless-stopped

volumes:
  listing-view-data:
